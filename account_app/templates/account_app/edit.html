{% extends "base.html" %}
{% load static %}

                </div>

    </div>

            <div class="row">

                                                    <fieldset>

                                                    </fieldset>
                                                </div>
                                                <div class="col-lg-12">
                                                    <fieldset>

                                                    </fieldset>
                                                </div>
                                                <div class="col-lg-12">
                                                    <fieldset>
                                                        <button type="submit" id="form-submit" class="main-button">Send

                                                        </button>
                                                    </fieldset>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>
        </div>
    </section>
{% endblock %}
