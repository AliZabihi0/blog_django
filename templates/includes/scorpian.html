<script>
(() => {
  document.addEventListener("DOMContentLoaded", () => {
    if (document.getElementById("beetle-canvas-bg")) return;

    // -------------------------
    // Input
    // -------------------------
    const Input = {
      keys: Array(230).fill(false),
      mouse: { left: false, right: false, middle: false, x: innerWidth / 2, y: innerHeight / 2 }
    };

    document.addEventListener("keydown", (e) => (Input.keys[e.keyCode] = true));
    document.addEventListener("keyup", (e) => (Input.keys[e.keyCode] = false));
    document.addEventListener("mousedown", (e) => {
      if (e.button === 0) Input.mouse.left = true;
      if (e.button === 1) Input.mouse.middle = true;
      if (e.button === 2) Input.mouse.right = true;
    });
    document.addEventListener("mouseup", (e) => {
      if (e.button === 0) Input.mouse.left = false;
      if (e.button === 1) Input.mouse.middle = false;
      if (e.button === 2) Input.mouse.right = false;
    });
    document.addEventListener("mousemove", (e) => {
      Input.mouse.x = e.clientX;
      Input.mouse.y = e.clientY;
    });

    // -------------------------
    // Canvas (background)
    // -------------------------
    const canvas = document.createElement("canvas");
    canvas.id = "beetle-canvas-bg";
    document.body.prepend(canvas);

    Object.assign(canvas.style, {
      position: "fixed",
      inset: "0",
      zIndex: "-1",          // زیر همه المان‌ها
      pointerEvents: "none", // کلیک‌های سایت مختل نشود
      background: "transparent"
    });

    const ctx = canvas.getContext("2d");

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // مختصات بر حسب px واقعی صفحه
    }
    window.addEventListener("resize", resize);
    resize();

    // -------------------------
    // Physics classes (from your idea, but render is custom)
    // -------------------------
    class Segment {
      constructor(parent, size, angle, range, stiffness) {
        this.isSegment = true;
        this.parent = parent;
        if (typeof parent.children === "object") parent.children.push(this);

        this.children = [];
        this.size = size;
        this.relAngle = angle;
        this.defAngle = angle;
        this.absAngle = parent.absAngle + angle;
        this.range = range;
        this.stiffness = stiffness;
        this.updateRelative(false, true);
      }

      updateRelative(iter, flex) {
        this.relAngle =
          this.relAngle - 2 * Math.PI * Math.floor((this.relAngle - this.defAngle) / (2 * Math.PI) + 0.5);

        if (flex) {
          this.relAngle = Math.min(
            this.defAngle + this.range / 2,
            Math.max(
              this.defAngle - this.range / 2,
              (this.relAngle - this.defAngle) / this.stiffness + this.defAngle
            )
          );
        }

        this.absAngle = this.parent.absAngle + this.relAngle;
        this.x = this.parent.x + Math.cos(this.absAngle) * this.size;
        this.y = this.parent.y + Math.sin(this.absAngle) * this.size;

        if (iter) for (let i = 0; i < this.children.length; i++) this.children[i].updateRelative(true, flex);
      }

      // ما دیگر اسکلت را رسم نمی‌کنیم (ظاهر جدید توسط Creature.draw رندر می‌شود)
      draw() {}

      follow(iter) {
        const x = this.parent.x;
        const y = this.parent.y;
        const dist = Math.hypot(this.x - x, this.y - y) || 0.0001;

        this.x = x + (this.size * (this.x - x)) / dist;
        this.y = y + (this.size * (this.y - y)) / dist;

        this.absAngle = Math.atan2(this.y - y, this.x - x);
        this.relAngle = this.absAngle - this.parent.absAngle;

        this.updateRelative(false, true);
        if (iter) for (let i = 0; i < this.children.length; i++) this.children[i].follow(true);
      }
    }

    class LimbSystem {
      constructor(end, length, speed, creature) {
        this.end = end;
        this.length = Math.max(1, length);
        this.creature = creature;
        this.speed = speed;

        creature.systems.push(this);
        this.nodes = [];

        let node = end;
        for (let i = 0; i < length; i++) {
          this.nodes.unshift(node);
          node = node.parent;
          if (!node.isSegment) {
            this.length = i + 1;
            break;
          }
        }
        this.hip = this.nodes[0].parent;
      }

      moveTo(x, y) {
        this.nodes[0].updateRelative(true, true);

        const dist = Math.hypot(x - this.end.x, y - this.end.y);
        let len = Math.max(0, dist - this.speed);

        for (let i = this.nodes.length - 1; i >= 0; i--) {
          const node = this.nodes[i];
          const ang = Math.atan2(node.y - y, node.x - x);
          node.x = x + len * Math.cos(ang);
          node.y = y + len * Math.sin(ang);
          x = node.x;
          y = node.y;
          len = node.size;
        }

        for (let i = 0; i < this.nodes.length; i++) {
          const node = this.nodes[i];
          node.absAngle = Math.atan2(node.y - node.parent.y, node.x - node.parent.x);
          node.relAngle = node.absAngle - node.parent.absAngle;

          for (let ii = 0; ii < node.children.length; ii++) {
            const childNode = node.children[ii];
            if (!this.nodes.includes(childNode)) childNode.updateRelative(true, false);
          }
        }
      }

      update() {
        this.moveTo(Input.mouse.x, Input.mouse.y);
      }
    }

    class LegSystem extends LimbSystem {
      constructor(end, length, speed, creature) {
        super(end, length, speed, creature);
        this.isLeg = true;

        this.goalX = end.x;
        this.goalY = end.y;
        this.step = 0;
        this.forwardness = 0;

        this.reach = 0.9 * Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);

        let relAngle =
          this.creature.absAngle - Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x);
        relAngle -= 2 * Math.PI * Math.floor(relAngle / (2 * Math.PI) + 0.5);

        this.swing = -relAngle + (2 * (relAngle < 0) - 1) * Math.PI / 2;
        this.swingOffset = this.creature.absAngle - this.hip.absAngle;
      }

      update() {
        this.moveTo(this.goalX, this.goalY);

        if (this.step === 0) {
          const dist = Math.hypot(this.end.x - this.goalX, this.end.y - this.goalY);
          if (dist > 1) {
            this.step = 1;
            this.goalX =
              this.hip.x +
              this.reach * Math.cos(this.swing + this.hip.absAngle + this.swingOffset) +
              (2 * Math.random() - 1) * (this.reach / 2);
            this.goalY =
              this.hip.y +
              this.reach * Math.sin(this.swing + this.hip.absAngle + this.swingOffset) +
              (2 * Math.random() - 1) * (this.reach / 2);
          }
        } else if (this.step === 1) {
          const theta =
            Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x) - this.hip.absAngle;
          const dist = Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);

          const forwardness2 = dist * Math.cos(theta);
          const dF = this.forwardness - forwardness2;
          this.forwardness = forwardness2;

          if (dF * dF < 1) {
            this.step = 0;
            this.goalX = this.hip.x + (this.end.x - this.hip.x);
            this.goalY = this.hip.y + (this.end.y - this.hip.y);
          }
        }
      }
    }

    class Creature {
      constructor(x, y, angle, fAccel, fFric, fRes, fThresh, rAccel, rFric, rRes, rThresh) {
        this.x = x;
        this.y = y;
        this.absAngle = angle;

        this.fSpeed = 0;
        this.fAccel = fAccel;
        this.fFric = fFric;
        this.fRes = fRes;
        this.fThresh = fThresh;

        this.rSpeed = 0;
        this.rAccel = rAccel;
        this.rFric = rFric;
        this.rRes = rRes;
        this.rThresh = rThresh;

        this.children = [];
        this.systems = [];

        this.body = []; // segments of body
        this.legs = []; // leg systems
      }

      follow(x, y) {
        const dist = Math.hypot(this.x - x, this.y - y);
        const angle = Math.atan2(y - this.y, x - this.x);

        // forward speed
        let accel = this.fAccel;
        if (this.systems.length > 0) {
          let sum = 0;
          for (let i = 0; i < this.systems.length; i++) sum += this.systems[i].step === 0;
          accel *= sum / this.systems.length;
        }

        this.fSpeed += accel * (dist > this.fThresh);
        this.fSpeed *= 1 - this.fRes;
        this.speed = Math.max(0, this.fSpeed - this.fFric);

        // rotation speed
        let dif = this.absAngle - angle;
        dif -= 2 * Math.PI * Math.floor(dif / (2 * Math.PI) + 0.5);
        if (Math.abs(dif) > this.rThresh && dist > this.fThresh) {
          this.rSpeed -= this.rAccel * (2 * (dif > 0) - 1);
        }
        this.rSpeed *= 1 - this.rRes;

        if (Math.abs(this.rSpeed) > this.rFric) {
          this.rSpeed -= this.rFric * (2 * (this.rSpeed > 0) - 1);
        } else {
          this.rSpeed = 0;
        }

        this.absAngle += this.rSpeed;
        this.absAngle -= 2 * Math.PI * Math.floor(this.absAngle / (2 * Math.PI) + 0.5);

        this.x += this.speed * Math.cos(this.absAngle);
        this.y += this.speed * Math.sin(this.absAngle);

        // update segments + legs
        this.absAngle += Math.PI;
        for (let i = 0; i < this.children.length; i++) this.children[i].follow(true);
        for (let i = 0; i < this.systems.length; i++) this.systems[i].update(x, y);
        this.absAngle -= Math.PI;

        // render
        this.draw();
      }

      draw() {
        renderBeetle(this);
      }
    }

    // -------------------------
    // Beetle renderer
    // -------------------------
    function lerp(a, b, t) { return a + (b - a) * t; }

    function renderBeetle(creature) {
      // پاک کردن
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      const pts = [{ x: creature.x, y: creature.y }, ...creature.body.map(s => ({ x: s.x, y: s.y }))];
      if (pts.length < 3) return;

      const headDir = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      const tNow = performance.now();

      // ---- بدن (پوسته) با استروک ضخیمِ قطعه‌ای ----
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = 0; i < pts.length - 1; i++) {
        const t = i / (pts.length - 2);

        // شکل سوسک: سر کوچیک، سینه متوسط، شکم بزرگ و انتها باریک
        let w;
        if (t < 0.18) w = lerp(14, 26, t / 0.18);
        else if (t < 0.70) w = lerp(26, 36, (t - 0.18) / 0.52);
        else w = lerp(36, 10, (t - 0.70) / 0.30);

        // رنگ پوسته (مشکی براق)
        ctx.strokeStyle = "rgba(20, 20, 26, 0.92)";
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 10;
        ctx.lineWidth = w;

        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
        ctx.stroke();
      }

      // ---- خطِ وسط بال‌ها (elytra split) ----
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      ctx.stroke();

      // ---- هایلایت براق ----
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      // ---- سر + چشم‌ها ----
      ctx.save();
      ctx.translate(pts[0].x, pts[0].y);
      ctx.rotate(headDir);

      ctx.fillStyle = "rgba(25,25,30,0.95)";
      ctx.beginPath(); // head
      ctx.ellipse(-8, 0, 11, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // eyes (کوچیک و قرمز)
      ctx.fillStyle = "rgba(255, 80, 80, 0.85)";
      ctx.beginPath();
      ctx.arc(-13, -3.2, 2.2, 0, Math.PI * 2);
      ctx.arc(-13,  3.2, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // ---- شاخک‌ها ----
      const wiggle = Math.sin(tNow / 380) * 0.25;
      for (const side of [-1, 1]) {
        const a = headDir + side * 0.55 + wiggle * side;
        const bx = pts[0].x + Math.cos(headDir) * -6;
        const by = pts[0].y + Math.sin(headDir) * -6;

        ctx.strokeStyle = "rgba(10,10,12,0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        const c1x = bx + Math.cos(a) * 18, c1y = by + Math.sin(a) * 18;
        const c2x = bx + Math.cos(a + side * 0.35) * 34, c2y = by + Math.sin(a + side * 0.35) * 34;
        const ex  = bx + Math.cos(a + side * 0.85) * 52, ey  = by + Math.sin(a + side * 0.85) * 52;
        ctx.bezierCurveTo(c1x, c1y, c2x, c2y, ex, ey);
        ctx.stroke();
      }

      // ---- پاها (۶ عدد) ----
      ctx.shadowColor = "rgba(0,0,0,0.25)";
      ctx.shadowBlur = 6;

      for (const leg of creature.legs) {
        const nodes = [{ x: leg.hip.x, y: leg.hip.y }, ...leg.nodes.map(n => ({ x: n.x, y: n.y }))];

        for (let i = 0; i < nodes.length - 1; i++) {
          const tt = i / Math.max(1, nodes.length - 2);
          ctx.strokeStyle = "rgba(12,12,14,0.75)";
          ctx.lineWidth = lerp(4, 1.6, tt);
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[i + 1].x, nodes[i + 1].y);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // -------------------------
    // Beetle setup (6 legs)
    // -------------------------
    function setupBeetle() {
      const c = new Creature(
        innerWidth / 2,
        innerHeight / 2,
        0,
        12,   // fAccel
        1,    // fFric
        0.5,  // fRes
        16,   // fThresh
        0.5,  // rAccel
        0.085,// rFric
        0.5,  // rRes
        0.3   // rThresh
      );

      // body chain: thorax + abdomen
      let node = c;

      const thorax = new Segment(node, 18, 0, Math.PI / 2.8, 1.2);
      c.body.push(thorax);
      node = thorax;

      // abdomen (تعدادی سگمنت برای کشیده شدن و طبیعی شدن)
      for (let i = 0; i < 14; i++) {
        const sz = 14 - i * 0.35;
        node = new Segment(node, sz, 0, Math.PI / 2.2, 1.25);
        c.body.push(node);
      }

      // legs: 3 pairs (front/mid/back)
      const attach = [c.body[1], c.body[4], c.body[8]];
      const legSpeed = 10;

      for (const side of [-1, 1]) {
        for (let j = 0; j < 3; j++) {
          const hip = attach[j];

          // زاویه اولیه پاها (جلو/وسط/عقب)
          const baseAng = side * (Math.PI / 2 + 0.18 * (j - 1));

          let a = new Segment(hip, 22, baseAng, Math.PI / 1.8, 1.55);
          let b = new Segment(a,   18, side * 0.25, Math.PI / 1.7, 1.7);
          let d = new Segment(b,   14, -side * 0.35, Math.PI / 1.6, 1.8);

          const leg = new LegSystem(d, 3, legSpeed, c);
          c.legs.push(leg);
        }
      }

      return c;
    }

    let critter = setupBeetle();

    // -------------------------
    // Animation loop
    // -------------------------
    function tick() {
      critter.follow(Input.mouse.x, Input.mouse.y);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
})();
</script>
